<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>生日快樂拼圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;900&display=swap">
<style>
/* Layout: one centered column. Bunting, headline with cake, two race-bib stat tags, a square sliding board, controls. Fireworks canvas covers the whole screen when solved. Single deliberate dark look (track blue, jersey orange, bib yellow). */
:root {
  --bg: #0d2646;
  --surface: #15365f;
  --slot: #0a1d37;
  --ink: #f3f6fb;
  --muted: #9bb2d0;
  --orange: #ff6b2c;
  --bib: #ffd43b;
  --sky: #5cc8ff;
  --rose: #ff9db8;
  --bib-ink: #17120a;
  --font-display: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(120% 60% at 50% -10%, #1b4577 0%, rgba(27, 69, 119, 0) 70%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 10px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* bunting */
.bunting { display: block; width: 100%; height: auto; overflow: visible; }
.bunting .string { fill: none; stroke: var(--muted); stroke-opacity: .55; stroke-width: 1.2; }
.bunting .pen { fill: transparent; stroke: var(--muted); stroke-opacity: .45; stroke-width: 1.2; transition: fill .5s ease var(--d, 0s), stroke-opacity .5s ease var(--d, 0s); }
.bunting .let { fill: var(--muted); font-family: var(--font-num); font-weight: 700; font-size: 19px; transition: fill .5s ease var(--d, 0s); }
.bunting .flag { transform-box: fill-box; transform-origin: 50% 0; }
body.won .bunting .pen { fill: var(--c); stroke-opacity: 0; }
body.won .bunting .let { fill: var(--bib-ink); }
body.won .bunting .flag { animation: swing 2.8s ease-in-out var(--d, 0s) infinite alternate; }
@keyframes swing { from { transform: rotate(-3.5deg); } to { transform: rotate(3.5deg); } }

/* headline */
.head { display: flex; align-items: flex-end; gap: 12px; }
.head-text { flex: 1; min-width: 0; }
.eyebrow { margin: 0 0 4px; font-family: var(--font-num); font-weight: 700; font-size: 14px; letter-spacing: .2em; color: var(--orange); }
h1 { margin: 0; font-weight: 900; font-size: clamp(30px, 9.4vw, 42px); line-height: 1.12; letter-spacing: .02em; text-wrap: balance; }
body.won h1 { color: var(--bib); }
.sub { margin: 8px 0 0; color: var(--muted); font-size: 14px; max-width: 30em; }
body.won .sub { color: var(--ink); }
.cake { flex: none; width: 62px; height: auto; display: block; }
.cake .flame { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; transition: opacity .6s ease .5s; }
body.won .cake .flame { opacity: 1; animation: flicker .5s ease-in-out infinite alternate; }
@keyframes flicker { from { transform: scaleY(1) scaleX(1); } to { transform: scaleY(1.14) scaleX(.9); } }

/* race-bib stats */
.stats { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: stretch; }
.bib { position: relative; background: var(--bib); color: var(--bib-ink); border-radius: 6px; padding: 8px 12px 7px; display: flex; flex-direction: column; gap: 1px; }
.bib::before, .bib::after { content: ""; position: absolute; top: 5px; width: 5px; height: 5px; border-radius: 50%; background: rgba(23, 18, 10, .3); }
.bib::before { left: 6px; }
.bib::after { right: 6px; }
.bib .k { font-weight: 500; font-size: 11px; line-height: 1.2; letter-spacing: .24em; padding-left: .24em; text-align: center; }
.bib .v { font-family: var(--font-num); font-weight: 700; font-size: 32px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }

/* board */
.board {
  position: relative; width: 100%; aspect-ratio: 1; background: var(--slot); border-radius: 10px; overflow: hidden;
  touch-action: manipulation; box-shadow: 0 0 0 4px var(--orange), 0 18px 40px rgba(0, 0, 0, .35);
  transition: box-shadow .6s ease;
}
body.won .board { box-shadow: 0 0 0 4px var(--bib), 0 0 44px rgba(255, 212, 59, .4); }
.tile {
  position: absolute; left: 0; top: 0; padding: 0; margin: 0; border: 0; border-radius: 0; cursor: pointer;
  width: calc(100% / var(--n)); height: calc(100% / var(--n));
  background-color: var(--surface); background-image: var(--img); background-size: calc(var(--n) * 100%) calc(var(--n) * 100%);
  box-shadow: inset 0 0 0 1.5px var(--bg);
  transition: transform .16s ease, opacity .6s ease, box-shadow .6s ease;
  -webkit-tap-highlight-color: transparent;
}
.tile:focus-visible { outline: 3px solid var(--bib); outline-offset: -3px; }
.tile.blank { opacity: 0; pointer-events: none; }
.board.solved .tile { box-shadow: none; cursor: default; }
.board.solved .tile.blank { opacity: 1; }
.celebrate { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; padding: 16px; pointer-events: none; opacity: 0; transition: opacity .6s ease .35s; }
body.won .celebrate { opacity: 1; }
.board.bare .celebrate { opacity: 0; transition-delay: 0s; }
.celebrate .card { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; max-width: 88%; padding: 14px 20px 16px; border-radius: 14px; background: rgba(13, 38, 70, .72); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); box-shadow: 0 0 0 1.5px rgba(255, 212, 59, .65), 0 10px 30px rgba(0, 0, 0, .35); transform: scale(.92); transition: transform .7s cubic-bezier(.2, 1.4, .4, 1) .35s; }
body.won .celebrate .card { transform: none; }
.celebrate .cake { width: 58px; }
.celebrate h2 { margin: 0; font-weight: 900; font-size: clamp(26px, 8.6vw, 36px); line-height: 1.15; letter-spacing: .04em; color: var(--bib); }
.celebrate p { margin: 0; font-size: clamp(13px, 3.9vw, 15px); line-height: 1.55; color: var(--ink); text-wrap: balance; }
.celebrate p { white-space: pre-line; }
.ref { position: absolute; inset: 0; background-image: var(--img); background-size: cover; opacity: 0; transition: opacity .2s ease; pointer-events: none; z-index: 2; }
.board.peek .ref { opacity: 1; }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font: 500 15px/1 var(--font-display); min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid transparent; cursor: pointer; color: var(--ink); background: transparent; -webkit-tap-highlight-color: transparent; }
.btn:focus-visible { outline: 3px solid var(--bib); outline-offset: 2px; }
.btn.primary { background: var(--orange); color: #1a0c04; font-weight: 900; }
.btn.ghost { border-color: rgba(155, 178, 208, .45); }
.btn.ghost[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.stats .btn { min-height: 0; padding: 0 14px; }
.grow { flex: 1; }

.back { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 6; font: 500 13px/1 var(--font-display); min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid rgba(155, 178, 208, .55); background: var(--slot); color: var(--ink); cursor: pointer; }
.mk { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.mk h1 { font-size: clamp(26px, 8vw, 34px); }
.mk label { font-size: 13px; color: var(--muted); letter-spacing: .08em; }
.mk .pick { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 999px; background: var(--orange); color: #1a0c04; font-weight: 900; font-size: 16px; letter-spacing: .04em; cursor: pointer; position: relative; overflow: hidden; }
.mk .pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.mk .pick:focus-within { outline: 3px solid var(--bib); outline-offset: 2px; }
.stage { width: 100%; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--slot); box-shadow: 0 0 0 4px var(--orange); touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
.mk input[type="text"], .mk textarea { width: 100%; box-sizing: border-box; font: 500 16px/1.5 var(--font-display); color: var(--ink); background: var(--slot); border: 1.5px solid rgba(155, 178, 208, .35); border-radius: 10px; padding: 10px 12px; resize: vertical; }
.mk input[type="text"]:focus, .mk textarea:focus { outline: 3px solid var(--bib); outline-offset: 1px; }
.mk input[type="range"] { width: 100%; accent-color: var(--orange); min-height: 32px; }
.mk .row { display: flex; flex-wrap: wrap; gap: 10px; }
.mk .row .btn { flex: 1 1 140px; }
.mk .hint, .mk .stat { margin: 0; font-size: 13px; color: var(--muted); }
.mk .stat { color: var(--ink); }
.mk .url { font-size: 12px; min-height: 64px; }
.mk .note { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--slot); font-size: 13px; color: var(--muted); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

@media (prefers-reduced-motion: reduce) {
  .tile, .board, .ref, .celebrate, .celebrate .card { transition: none; }
  body.won .bunting .flag, body.won .cake .flame { animation: none; }
}
@media (max-width: 360px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .stats .btn { grid-column: 1 / -1; min-height: 40px; }
  .cake { width: 52px; }
}
</style>

<div class="wrap" id="game">
  <svg id="bunting" class="bunting" viewBox="0 0 360 108" role="img" aria-label="HAPPY BIRTHDAY 彩旗"></svg>

  <header class="head">
    <div class="head-text">
      <p class="eyebrow" id="eyebrow">BIRTHDAY RUN</p>
      <h1 id="title">拼出今天的笑容</h1>
      <p class="sub" id="sub" aria-live="polite">點一下方塊滑進空格，把照片拼回原樣。</p>
    </div>
  </header>

  <div class="stats">
    <div class="bib"><span class="k">步數</span><span class="v" id="moves">0</span></div>
    <div class="bib"><span class="k">時間</span><span class="v" id="time">0:00</span></div>
    <button type="button" class="btn ghost" id="peek" aria-pressed="false">看原圖</button>
  </div>

  <div class="board" id="board" role="group" aria-label="滑塊拼圖，點方塊移動">
    <div class="ref" id="ref"></div>
    <div class="celebrate" id="celebrate" aria-hidden="true">
      <div class="card">
      <svg class="cake" viewBox="0 0 84 96" aria-hidden="true">
      <ellipse cx="42" cy="89" rx="38" ry="6" fill="rgba(255,255,255,.14)"/>
      <rect x="7" y="58" width="70" height="29" rx="6" fill="#ff6b2c"/>
      <path d="M7 64 Q7 58 13 58 H71 Q77 58 77 64 V66 Q72 76 67 66 Q62 76 57 66 Q52 76 47 66 Q42 76 37 66 Q32 76 27 66 Q22 76 17 66 Q12 76 7 66 Z" fill="#f3f6fb"/>
      <rect x="16" y="38" width="52" height="22" rx="5" fill="#ffd43b"/>
      <path d="M16 43 Q16 38 21 38 H63 Q68 38 68 43 V45 Q63 55 58 45 Q53 55 48 45 Q43 55 38 45 Q33 55 28 45 Q23 55 18 45 L16 45 Z" fill="#f3f6fb"/>
      <rect x="23.5" y="22" width="5" height="17" rx="1.5" fill="#5cc8ff"/>
      <rect x="39.5" y="22" width="5" height="17" rx="1.5" fill="#ff9db8"/>
      <rect x="55.5" y="22" width="5" height="17" rx="1.5" fill="#5cc8ff"/>
      <path class="flame" d="M26 6 C30 11 29 18 26 20.5 C23 18 22 11 26 6 Z" fill="#ffd43b" stroke="#ff6b2c" stroke-width="1.4"/>
      <path class="flame" d="M42 6 C46 11 45 18 42 20.5 C39 18 38 11 42 6 Z" fill="#ffd43b" stroke="#ff6b2c" stroke-width="1.4"/>
      <path class="flame" d="M58 6 C62 11 61 18 58 20.5 C55 18 54 11 58 6 Z" fill="#ffd43b" stroke="#ff6b2c" stroke-width="1.4"/>
      </svg>
        <h2>生日快樂！</h2>
        <p>祝妳新的一歲，笑著一路跑到終點。</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <button type="button" class="btn ghost" id="demo">自動示範</button>
    <button type="button" class="btn primary grow" id="shuffle">重新洗牌</button>
    <button type="button" class="btn ghost" id="replay" hidden>再放一次煙火</button>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<button type="button" class="back" id="back" hidden>← 回製作台</button>

<main class="mk" id="maker" hidden>
  <div>
    <p class="eyebrow">BIRTHDAY RUN · 製作台</p>
    <h1>換一張照片</h1>
  </div>
  <label class="pick">選擇照片<input id="pick" type="file" accept="image/*"></label>
  <div class="stage"><canvas id="crop" width="720" height="720" aria-label="照片裁切預覽，可拖曳調整位置"></canvas></div>
  <label for="zoom">放大</label>
  <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
  <p class="hint">拖曳照片調整位置。拼圖會用這個正方形範圍。</p>
  <label for="mt">標題</label>
  <input type="text" id="mt" maxlength="14">
  <label for="mm">祝福語</label>
  <textarea id="mm" rows="3" maxlength="60"></textarea>
  <div class="row">
    <button type="button" class="btn ghost" id="mtest">試玩看看</button>
    <button type="button" class="btn primary" id="mlink">產生分享連結</button>
    <button type="button" class="btn ghost" id="mdl">下載高畫質遊戲檔</button>
  </div>
  <p class="stat" id="mstat" aria-live="polite"></p>
  <textarea class="url" id="murl" rows="3" readonly hidden aria-label="分享連結"></textarea>
  <p class="note">分享連結的照片會壓縮，畫質較低，適合用 LINE 傳。要高畫質或做 QR code，請下載遊戲檔，上傳到網頁空間後用那個網址。</p>

<script>
var PRISTINE = document.documentElement.outerHTML;
(function () {
  var CFG = {};
  try { CFG = JSON.parse(document.getElementById('cfg').textContent); } catch (e) {}
  var b64d = function (s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return atob(s); };
  var b64e = function (s) { return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  try {
    var hm = /^#g=([^~]+)~(.*)$/.exec(location.hash);
    if (hm) {
      var tx = JSON.parse(decodeURIComponent(escape(b64d(hm[2]))));
      CFG = { img: 'data:image/jpeg;base64,' + hm[1].replace(/-/g, '+').replace(/_/g, '/'), t: tx.t, m: tx.m };
    }
  } catch (e) {}
  var IMG = CFG.img || '';
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var board = $('board'), movesEl = $('moves'), timeEl = $('time');
  var eyebrow = $('eyebrow'), title = $('title'), sub = $('sub');
  var peekBtn = $('peek'), shuffleBtn = $('shuffle'), replayBtn = $('replay'), demoBtn = $('demo'), celebrate = $('celebrate');
  function applyCfg(c) {
    IMG = c.img;
    board.style.setProperty('--img', 'url("' + IMG + '")');
    document.documentElement.style.setProperty('--img', 'url("' + IMG + '")');
    celebrate.querySelector('h2').textContent = c.t || '生日快樂！';
    celebrate.querySelector('p').textContent = c.m || '';
  }
  applyCfg(CFG);

  var TEXT = {
    idle: ['BIRTHDAY RUN', '拼出今天的笑容', '點一下方塊滑進空格，把照片拼回原樣。'],
    won: ['FINISH LINE', '完賽！', '']
  };

  /* ---------- bunting ---------- */
  (function buildBunting() {
    var NS = 'http://www.w3.org/2000/svg';
    var svg = $('bunting');
    var colors = ['#ff6b2c', '#ffd43b', '#5cc8ff', '#ff9db8'];
    var idx = 0;
    function row(text, x0, x1, y0, sag) {
      var s = document.createElementNS(NS, 'path');
      s.setAttribute('class', 'string');
      s.setAttribute('d', 'M' + x0 + ' ' + y0 + ' Q' + ((x0 + x1) / 2) + ' ' + (y0 + 2 * sag) + ' ' + x1 + ' ' + y0);
      svg.appendChild(s);
      var pitch = (x1 - x0) / text.length;
      for (var i = 0; i < text.length; i++) {
        var x = x0 + pitch * (i + 0.5);
        var t = (x - x0) / (x1 - x0);
        var y = y0 + 4 * sag * t * (1 - t);
        var ang = Math.atan(4 * sag * (1 - 2 * t) / (x1 - x0)) * 180 / Math.PI;
        var g = document.createElementNS(NS, 'g');
        g.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + ang.toFixed(1) + ')');
        var f = document.createElementNS(NS, 'g');
        f.setAttribute('class', 'flag');
        var d = (idx * 0.08).toFixed(2) + 's';
        f.setAttribute('style', '--c:' + colors[idx % colors.length] + ';--d:' + d);
        var p = document.createElementNS(NS, 'path');
        p.setAttribute('class', 'pen');
        p.setAttribute('d', 'M-18.5 0 H18.5 L0 40 Z');
        var tx = document.createElementNS(NS, 'text');
        tx.setAttribute('class', 'let');
        tx.setAttribute('x', '0'); tx.setAttribute('y', '18'); tx.setAttribute('text-anchor', 'middle');
        tx.textContent = text.charAt(i);
        f.appendChild(p); f.appendChild(tx); g.appendChild(f); svg.appendChild(g);
        idx++;
      }
    }
    row('HAPPY', 72, 288, 6, 8);
    row('BIRTHDAY', 8, 352, 58, 8);
  })();

  /* ---------- puzzle ---------- */
  var n = 3, B = 8, cell = [], tiles = [];
  var moves = 0, t0 = 0, timer = 0, solved = false, demoing = false, demoTimers = [], hist = [];

  function build(size) {
    n = size; B = n * n - 1;
    board.style.setProperty('--n', n);
    for (var i = 0; i < tiles.length; i++) tiles[i].remove();
    tiles = [];
    for (var id = 0; id < n * n; id++) {
      (function (id) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'tile';
        var r = Math.floor(id / n), c = id % n;
        b.style.backgroundPosition = (c / (n - 1) * 100) + '% ' + (r / (n - 1) * 100) + '%';
        if (id === B) { b.classList.add('blank'); b.tabIndex = -1; b.setAttribute('aria-hidden', 'true'); }
        else b.setAttribute('aria-label', '拼圖方塊 ' + (id + 1));
        b.addEventListener('click', function () { onTile(id); });
        board.appendChild(b);
        tiles.push(b);
      })(id);
    }
    demoBtn.disabled = false;
    shuffle();
  }

  function render() {
    for (var id = 0; id < tiles.length; id++) {
      var c = cell[id];
      tiles[id].style.transform = 'translate(' + (c % n) * 100 + '%,' + Math.floor(c / n) * 100 + '%)';
    }
  }

  function isSolved() {
    for (var i = 0; i < cell.length; i++) if (cell[i] !== i) return false;
    return true;
  }

  function tileAt(c) { return cell.indexOf(c); }

  /* every single-tile step is logged; stepping the same tile back cancels the step, so reversing the log always solves the board */
  function record(tid) {
    if (hist.length && hist[hist.length - 1] === tid) hist.pop(); else hist.push(tid);
  }

  function slide(id) {
    var bc = cell[B], c = cell[id];
    var cr = Math.floor(c / n), cc = c % n, br = Math.floor(bc / n), bcc = bc % n;
    if (cr !== br && cc !== bcc) return false;
    var dr = Math.sign(br - cr), dc = Math.sign(bcc - cc);
    var chain = [], r = br, col = bcc;
    while (r !== cr || col !== cc) { r -= dr; col -= dc; chain.push(r * n + col); }
    var target = bc;
    for (var i = 0; i < chain.length; i++) {
      var tid = tileAt(chain[i]);
      record(tid);
      cell[tid] = target;
      target = chain[i];
    }
    cell[B] = target;
    return true;
  }

  function shuffle() {
    clearFx();
    solved = false; moves = 0; t0 = 0;
    stopDemo();
    clearInterval(timer); timer = 0;
    celebrate.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('won');
    board.classList.remove('solved', 'peek', 'bare');
    peekBtn.setAttribute('aria-pressed', 'false'); peekBtn.textContent = '看原圖'; peekBtn.disabled = false;
    replayBtn.hidden = true; shuffleBtn.textContent = '重新洗牌';
    eyebrow.textContent = TEXT.idle[0]; title.textContent = TEXT.idle[1]; sub.textContent = TEXT.idle[2];
    tiles[B].setAttribute('aria-hidden', 'true');
    movesEl.textContent = '0'; timeEl.textContent = '0:00';

    do {
      cell = []; hist = []; for (var i = 0; i < n * n; i++) cell.push(i);
      var last = -1, steps = n === 3 ? 24 : 70;
      for (var s = 0; s < steps; s++) {
        var bc = cell[B], r = Math.floor(bc / n), c = bc % n, opts = [];
        if (r > 0) opts.push(bc - n);
        if (r < n - 1) opts.push(bc + n);
        if (c > 0) opts.push(bc - 1);
        if (c < n - 1) opts.push(bc + 1);
        opts = opts.filter(function (o) { return o !== last; });
        var pick = opts[Math.floor(Math.random() * opts.length)];
        var ptid = tileAt(pick);
        record(ptid);
        cell[ptid] = bc;
        cell[B] = pick;
        last = bc;
      }
    } while (isSolved());
    render();
  }

  function fmt(ms) {
    var s = Math.floor(ms / 1000), m = Math.floor(s / 60);
    return m + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
  }

  function onTile(id, auto) {
    if (solved || id === B || (demoing && !auto)) return;
    if (!slide(id)) return;
    moves++;
    movesEl.textContent = moves;
    if (!t0) {
      t0 = Date.now();
      timer = setInterval(function () { timeEl.textContent = fmt(Date.now() - t0); }, 250);
    }
    render();
    if (isSolved()) win();
  }

  function win() {
    solved = true;
    clearInterval(timer); timer = 0;
    timeEl.textContent = fmt(Date.now() - t0);
    board.classList.remove('peek');
    board.classList.add('solved');
    celebrate.removeAttribute('aria-hidden');
    peekBtn.setAttribute('aria-pressed', 'false'); peekBtn.textContent = '看照片'; peekBtn.disabled = false;
    tiles[B].removeAttribute('aria-hidden');
    document.body.classList.add('won');
    eyebrow.textContent = TEXT.won[0]; title.textContent = TEXT.won[1]; sub.textContent = '共 ' + moves + ' 步，用時 ' + timeEl.textContent + '。生日快樂！';
    replayBtn.hidden = false; shuffleBtn.textContent = '再玩一次'; demoBtn.disabled = true;
    setTimeout(fireworks, reduce ? 0 : 350);
  }

  function solveBFS() {
    var start = new Array(9);
    for (var id = 0; id < 9; id++) start[cell[id]] = id;
    var key = start.join(''), goal = '012345678';
    if (key === goal) return [];
    var prev = {}; prev[key] = null;
    var q = [key], qi = 0, found = false;
    while (qi < q.length && !found) {
      var k = q[qi++], bi = k.indexOf('8'), r = Math.floor(bi / 3), c = bi % 3, nbs = [];
      if (r > 0) nbs.push(bi - 3);
      if (r < 2) nbs.push(bi + 3);
      if (c > 0) nbs.push(bi - 1);
      if (c < 2) nbs.push(bi + 1);
      for (var j = 0; j < nbs.length; j++) {
        var nb = nbs[j], a = k.split('');
        a[bi] = a[nb]; a[nb] = '8';
        var nk = a.join('');
        if (prev.hasOwnProperty(nk)) continue;
        prev[nk] = [k, parseInt(k.charAt(nb), 10)];
        if (nk === goal) { found = true; break; }
        q.push(nk);
      }
    }
    var path = [], cur = goal;
    while (prev[cur]) { path.push(prev[cur][1]); cur = prev[cur][0]; }
    return path.reverse();
  }

  function stopDemo() {
    demoTimers.forEach(clearTimeout); demoTimers = [];
    demoing = false;
    demoBtn.textContent = '自動示範';
    demoBtn.disabled = solved;
  }

  function demo() {
    if (solved || demoing) return;
    var path = solveBFS();
    if (!path.length) return;
    var step = 420;
    demoing = true;
    demoBtn.textContent = '示範中…'; demoBtn.disabled = true;
    path.forEach(function (id, i) {
      demoTimers.push(setTimeout(function () {
        onTile(id, true);
        if (i === path.length - 1) stopDemo();
      }, 500 + i * step));
    });
  }
  demoBtn.addEventListener('click', demo);

  document.addEventListener('keydown', function (e) {
    var map = { ArrowUp: n, ArrowDown: -n, ArrowLeft: 1, ArrowRight: -1 };
    if (!(e.key in map) || solved) return;
    var bc = cell[B], c = bc % n, r = Math.floor(bc / n);
    if (e.key === 'ArrowUp' && r === n - 1) return;
    if (e.key === 'ArrowDown' && r === 0) return;
    if (e.key === 'ArrowLeft' && c === n - 1) return;
    if (e.key === 'ArrowRight' && c === 0) return;
    e.preventDefault();
    onTile(tileAt(bc + map[e.key]));
  });

  peekBtn.addEventListener('click', function () {
    if (solved) {
      var bare = board.classList.toggle('bare');
      peekBtn.setAttribute('aria-pressed', bare ? 'true' : 'false');
      peekBtn.textContent = bare ? '顯示祝福' : '看照片';
      return;
    }
    var on = !board.classList.contains('peek');
    board.classList.toggle('peek', on);
    peekBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    peekBtn.textContent = on ? '收起原圖' : '看原圖';
  });
  shuffleBtn.addEventListener('click', shuffle);
  replayBtn.addEventListener('click', fireworks);

  /* ---------- fireworks ---------- */
  var cv = $('fx'), ctx = cv.getContext('2d');
  var W = 0, H = 0;
  var PAL = ['#ff6b2c', '#ffd43b', '#5cc8ff', '#ff9db8', '#ffffff', '#9be37a'];
  var rockets = [], sparks = [], timers = [], raf = 0, pending = 0;

  function size() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', size);
  size();

  function launch() {
    var x = W * (0.14 + Math.random() * 0.72), ty = H * (0.12 + Math.random() * 0.3);
    rockets.push({ x: x, y: H + 8, ty: ty, vy: -(H - ty + 8) / 52, vx: (Math.random() - 0.5) * 0.6, col: PAL[Math.random() * PAL.length | 0] });
    loop();
  }

  function burst(x, y, col) {
    var count = reduce ? 36 : 70 + (Math.random() * 40 | 0);
    var ring = Math.random() < 0.35;
    var col2 = PAL[Math.random() * PAL.length | 0];
    for (var i = 0; i < count; i++) {
      var a = Math.PI * 2 * i / count + Math.random() * 0.08;
      var sp = ring ? 3.4 + Math.random() * 0.2 : 1 + Math.random() * 4.4;
      sparks.push({ x: x, y: y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, dec: 0.011 + Math.random() * 0.012, col: Math.random() < 0.7 ? col : col2 });
    }
  }

  function loop() { if (!raf) raf = requestAnimationFrame(step); }

  function step() {
    raf = 0;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    var i;
    for (i = rockets.length - 1; i >= 0; i--) {
      var r = rockets[i];
      r.x += r.vx; r.y += r.vy;
      ctx.globalAlpha = 1; ctx.strokeStyle = r.col; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(r.x - r.vx * 3, r.y - r.vy * 3); ctx.lineTo(r.x, r.y); ctx.stroke();
      if (r.y <= r.ty) { burst(r.x, r.y, r.col); rockets.splice(i, 1); }
    }
    for (i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];
      s.px = s.x; s.py = s.y;
      s.vx *= 0.985; s.vy = s.vy * 0.985 + 0.045;
      s.x += s.vx; s.y += s.vy; s.life -= s.dec;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.globalAlpha = s.life; ctx.strokeStyle = s.col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(s.px, s.py); ctx.lineTo(s.x, s.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (rockets.length || sparks.length || pending > 0) raf = requestAnimationFrame(step);
    else { ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, W, H); }
  }

  function clearFx() {
    timers.forEach(clearTimeout); timers = [];
    rockets = []; sparks = []; pending = 0;
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);
  }

  function fireworks() {
    clearFx();
    var total = reduce ? 3 : 9, gap = reduce ? 600 : 560;
    pending = total;
    for (var i = 0; i < total; i++) {
      timers.push(setTimeout(function () { pending--; launch(); }, i * gap + Math.random() * 180));
    }
    loop();
  }

  /* ---------- maker ---------- */
  var gameEl = $('game'), makerEl = $('maker'), backBtn = $('back');
  window.addEventListener('hashchange', function () { location.reload(); });
  var cropCv = $('crop'), cctx = cropCv.getContext('2d'), zoomEl = $('zoom');
  var mt = $('mt'), mm = $('mm'), mstat = $('mstat'), murl = $('murl');
  var src = null, cx = 0, cy = 0, zoom = 1;

  function span() { return Math.min(src.naturalWidth, src.naturalHeight) / zoom; }
  function clampC() {
    var s = span(), w = src.naturalWidth, h = src.naturalHeight;
    cx = Math.max(s / 2, Math.min(w - s / 2, cx));
    cy = Math.max(s / 2, Math.min(h - s / 2, cy));
  }
  function drawTo(cv, px) {
    var c = cv.getContext('2d'), s = span();
    cv.width = px; cv.height = px;
    c.drawImage(src, cx - s / 2, cy - s / 2, s, s, 0, 0, px, px);
  }
  function redraw() { if (src) { clampC(); drawTo(cropCv, 720); } }
  function loadSrc(url, done) {
    var im = new Image();
    im.onload = function () { src = im; zoom = 1; zoomEl.value = 1; cx = im.naturalWidth / 2; cy = im.naturalHeight / 2; redraw(); if (done) done(); };
    im.onerror = function () { mstat.textContent = '這張照片讀不進來，請換一張。'; };
    im.src = url;
  }
  function jpeg(px, q) {
    var cv = document.createElement('canvas');
    drawTo(cv, px);
    return cv.toDataURL('image/jpeg', q);
  }
  function current(px, q) { return { img: jpeg(px, q), t: mt.value.trim() || '生日快樂！', m: mm.value.trim() }; }

  $('pick').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { loadSrc(r.result, function () { mstat.textContent = '照片已載入，可拖曳或放大調整。'; }); };
    r.readAsDataURL(f);
  });
  zoomEl.addEventListener('input', function () { zoom = parseFloat(zoomEl.value); redraw(); });
  var drag = null;
  cropCv.addEventListener('pointerdown', function (e) { if (!src) return; drag = { x: e.clientX, y: e.clientY }; cropCv.setPointerCapture(e.pointerId); });
  cropCv.addEventListener('pointermove', function (e) {
    if (!drag || !src) return;
    var k = span() / cropCv.getBoundingClientRect().width;
    cx -= (e.clientX - drag.x) * k; cy -= (e.clientY - drag.y) * k;
    drag = { x: e.clientX, y: e.clientY };
    redraw();
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) { cropCv.addEventListener(ev, function () { drag = null; }); });

  $('mtest').addEventListener('click', function () {
    if (!src) return;
    applyCfg(current(720, 0.82));
    makerEl.hidden = true; gameEl.hidden = false; backBtn.hidden = false;
    shuffle();
  });
  backBtn.addEventListener('click', function () {
    clearFx(); backBtn.hidden = true; gameEl.hidden = true; makerEl.hidden = false;
    document.body.classList.remove('won');
  });

  function buildLink() {
    if (!src) return null;
    var text = b64e(unescape(encodeURIComponent(JSON.stringify({ t: mt.value.trim() || '生日快樂！', m: mm.value.trim() }))));
    var sizes = [480, 420, 380, 340, 300, 270, 240, 210], qs = [0.6, 0.45, 0.35], last = null;
    for (var i = 0; i < sizes.length; i++) {
      for (var j = 0; j < qs.length; j++) {
        var d = jpeg(sizes[i], qs[j]).split(',')[1].replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        last = { link: location.origin + location.pathname + '#g=' + d + '~' + text, px: sizes[i], q: qs[j] };
        if (last.link.length <= 8000) return last;
      }
    }
    return last;
  }
  $('mlink').addEventListener('click', function () {
    var r = buildLink();
    if (!r) { mstat.textContent = '請先選一張照片。'; return; }
    murl.hidden = false; murl.value = r.link; murl.focus(); murl.select();
    var msg = '連結共 ' + r.link.length + ' 字，照片壓成 ' + r.px + '×' + r.px + '。';
    var done = function () { mstat.textContent = '已複製。' + msg; };
    var fail = function () { mstat.textContent = '請長按上方連結全選後複製。' + msg; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(r.link).then(done, fail); else fail();
  });
  $('mdl').addEventListener('click', function () {
    if (!src) { mstat.textContent = '請先選一張照片。'; return; }
    var html = '<!doctype html>\n' + PRISTINE.replace(/(<script id="cfg" type="application\/json">)[\s\S]*?(<\/script>)/, function (_, a, b) {
      return a + JSON.stringify(current(720, 0.82)).replace(/</g, '\\u003c') + b;
    });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    a.download = 'index.html';
    document.body.appendChild(a); a.click(); a.remove();
    mstat.textContent = '已下載 index.html，上傳到網頁空間後就是新的遊戲。';
  });

  if (location.hash === '#maker') {
    gameEl.hidden = true; makerEl.hidden = false;
    mt.value = celebrate.querySelector('h2').textContent;
    mm.value = celebrate.querySelector('p').textContent;
    loadSrc(IMG);
  }

  build(3);
})();
</script>
